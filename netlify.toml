[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Same shape as vercel.json: the browser only talks to its own origin, and the
# CDN proxies /api and /images. This is the part that makes an alternate host
# work from networks where *.vercel.app / swypemeal.ru is unreachable.
[[redirects]]
  from = "/api/*"
  to = "https://swypemeal.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/images/*"
  to = "https://images.unsplash.com/:splat"
  status = 200
  force = true

# SPA fallback. Keep this rule last.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

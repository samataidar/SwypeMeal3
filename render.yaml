services:
  - type: web
    name: swypemeal-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: PORT
        value: 8000
      - key: SUPABASE_URL
        value: https://bbelyefgpptozjfmeyqq.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: USE_SUPABASE
        value: "true"
      - key: ALLOW_INSECURE_AUTH
        value: "false"
      - key: CORS_ORIGINS
        value: https://swype-meal3.vercel.app,https://swypemeal.ru,https://www.swypemeal.ru
